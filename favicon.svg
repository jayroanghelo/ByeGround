<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Checkerboard pattern -->
    <pattern id="checker" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#ffffff" />
      <rect width="16" height="16" fill="#e2e8f0" />
      <rect x="16" y="16" width="16" height="16" fill="#e2e8f0" />
    </pattern>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <clipPath id="squircle">
      <path d="M 256,0 C 76,0 0,76 0,256 C 0,436 76,512 256,512 C 436,512 512,436 512,256 C 512,76 436,0 256,0 Z" />
    </clipPath>
    <clipPath id="halfClip">
      <rect x="0" y="256" width="512" height="256" />
    </clipPath>
  </defs>

  <!-- Background base dark -->
  <rect width="512" height="512" fill="#1e1e2e" clip-path="url(#squircle)" />
  
  <!-- Checkerboard bottom half -->
  <rect width="512" height="512" fill="url(#checker)" clip-path="url(#halfClip)" style="clip-path: url(#squircle);" />

  <!-- The Leaf Subject -->
  <g filter="url(#shadow)">
    <!-- A modern overlapping leaf shape -->
    <path d="M 384,128 C 384,269 269,384 128,384 C 128,243 243,128 384,128 Z" fill="url(#leafGrad)" />
    <!-- Inner glass overlay -->
    <path d="M 384,128 C 384,269 269,384 128,384 C 128,243 243,128 384,128 Z" fill="url(#glassGrad)" />
    
    <!-- Leaf veins -->
    <path d="M 128,384 C 180,332 282,230 384,128 M 200,312 C 220,332 260,372 260,372 M 140,252 C 160,272 200,312 200,312 M 260,252 C 280,272 320,312 320,312 M 200,192 C 220,212 260,252 260,252" stroke="rgba(255,255,255,0.7)" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>
</svg>
